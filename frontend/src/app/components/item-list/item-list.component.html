<div style="height: 100vh; background-color: #f0f0f0; color: #333;">
  <h1>Welcome to the Item List Component</h1>
  <p>This component displays a list of items fetched from the backend.</p>
  <h2>Item List</h2>
  <table border="1">
    <tr>
      <th>ID</th>
      <th>Name</th>
    </tr>
    <tr *ngFor="let item of items">
      <td>{{ item.id }}</td>
      <td>{{ item.name }}</td>
    </tr>
  </table>
</div>
